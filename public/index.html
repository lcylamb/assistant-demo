<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报销单问答 · 流式演示</title>
<style>
  :root {
    --line: #e3e6ea;
    --ink: #1f2328;
    --dim: #6b7480;
    --accent: #2f6fed;
    --ok: #1a7f45;
    --warn: #9a6700;
    --bad: #b42318;
    --bg-soft: #f6f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 32px 20px 64px;
    max-width: 780px;
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #fff;
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  .sub { margin: 0 0 28px; color: var(--dim); font-size: 13px; }

  .field { margin-bottom: 14px; }
  label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--dim); }
  input {
    width: 100%;
    padding: 9px 11px;
    font: inherit;
    color: inherit;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    padding: 9px 16px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--bg-soft); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #2559c9; }

  .presets { margin: 16px 0 26px; display: flex; gap: 8px; flex-wrap: wrap; }
  .presets button { font-size: 13px; padding: 5px 11px; color: var(--dim); }

  .panel {
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 18px 20px 16px;
  }
  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .badge {
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 99px;
    background: var(--bg-soft);
    color: var(--dim);
  }
  .badge.streaming    { background: #e8f0fe; color: var(--accent); }
  .badge.done         { background: #e6f4ec; color: var(--ok); }
  .badge.insufficient { background: #fdf3e0; color: var(--warn); }
  .badge.error        { background: #fdeceb; color: var(--bad); }

  #conclusion { margin: 0; min-height: 1.7em; white-space: pre-wrap; }
  #conclusion.caret::after {
    content: "";
    display: inline-block;
    width: 7px; height: 1.05em;
    margin-left: 1px;
    vertical-align: text-bottom;
    background: var(--accent);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .evidence { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .evidence:empty { display: none; }
  .evidence code {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 5px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--dim);
  }

  .metrics {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    color: var(--dim);
  }
  .metrics b { color: var(--ink); font-weight: 600; }
  .hint { margin-top: 22px; font-size: 12.5px; color: var(--dim); }
</style>
</head>
<body>

<h1>报销单问答</h1>
<p class="sub">一个字一个字出来的是模型的原始输出；结束时才变成「已确认」—— 那一瞬间走的是和非流式端点完全相同的校验。</p>

<div class="field">
  <label for="code">单号</label>
  <input id="code" value="BX-2026-0003" spellcheck="false">
</div>

<div class="field">
  <label for="question">问题</label>
  <input id="question" value="这张单子为什么被驳回了？">
</div>

<div class="row">
  <button id="ask" class="primary">问一句</button>
  <button id="stop" disabled>停止</button>
</div>

<div class="presets">
  <button data-code="BX-2026-0003" data-question="这张单子为什么被驳回了？">已驳回的单子</button>
  <button data-code="BX-2026-0005" data-question="审批意见是什么？">草稿单问审批（应信息不足）</button>
  <button data-code="BX-2026-0006" data-question="这笔钱都花在哪些项目上？">问明细</button>
</div>

<div class="panel">
  <div class="panel-head">
    <span id="badge" class="badge">待提问</span>
  </div>
  <p id="conclusion"></p>
  <div id="evidence" class="evidence"></div>
  <div id="metrics" class="metrics"></div>
</div>

<p class="hint">
  改 <code>src/modules/llm/mock-llm.provider.ts</code> 里那两个常量（每块几个字、块间隔），
  首字延迟和总耗时的差距会跟着变 —— 这正是「真流式」和「攒完再吐」的区别。
</p>

<script>
const $ = (id) => document.getElementById(id);

const BADGE_TEXT = {
  idle: '待提问',
  streaming: '生成中…',
  done: '已确认',
  insufficient: '信息不足',
  stopped: '已停止',
  error: '出错',
};

let controller = null;

// ---------------------------------------------------------------- 交互

$('ask').addEventListener('click', ask);
$('stop').addEventListener('click', () => controller && controller.abort());

for (const preset of document.querySelectorAll('.presets button')) {
  preset.addEventListener('click', () => {
    $('code').value = preset.dataset.code;
    $('question').value = preset.dataset.question;
    ask();
  });
}

for (const input of document.querySelectorAll('input')) {
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') ask();
  });
}

// ---------------------------------------------------------------- 主流程

async function ask() {
  const code = $('code').value.trim();
  const question = $('question').value.trim();
  if (!code || !question || controller) return;

  controller = new AbortController();
  $('ask').disabled = true;
  $('stop').disabled = false;
  $('conclusion').textContent = '';
  $('evidence').innerHTML = '';
  $('metrics').textContent = '';
  setBadge('streaming', /* caret */ true);

  const startedAt = performance.now();
  let firstDeltaAt = null;
  let deltaChars = 0;

  try {
    const response = await fetch('/assistant/askStream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, question }),
      signal: controller.signal,
    });

    // 后端在写 SSE 响应头**之前**就取完数了，所以「单号不存在」「参数不合法」
    // 这类错误在这里还能拿到一个正常的 JSON 响应 —— 不是一段流。
    if (!response.ok) {
      const body = await response.json().catch(() => null);
      const message = body && body.message;
      throw new Error(
        Array.isArray(message) ? message.join('；') : message || `HTTP ${response.status}`,
      );
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;

      // ⚠️ `{ stream: true }`：一个多字节字符可能被切在两个 chunk 之间，
      // 不加这个参数，每次 decode 都会把它解成乱码。
      // 换行归一化是给别的 SSE 实现留的余地 —— 我们自己的服务只写 \n\n。
      buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');

      // ⚠️ 一次 read 拿到的**不是**一个完整帧。必须自己按 \n\n 切，
      // 并把最后一个不完整的帧留在 buffer 里等下一块 —— 这和后端那个增量解析器
      // 面对的是同一类问题：断点可能落在任何地方。
      let boundary;
      while ((boundary = buffer.indexOf('\n\n')) !== -1) {
        const frame = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);

        const { name, data } = parseFrame(frame);

        if (name === 'delta') {
          if (firstDeltaAt === null) firstDeltaAt = performance.now();
          deltaChars += data.text.length;
          $('conclusion').textContent += data.text;
        } else if (name === 'done') {
          finish(data, startedAt, firstDeltaAt, deltaChars);
        } else if (name === 'error') {
          setBadge('error');
          $('conclusion').textContent = data.message;
        }
      }
    }
  } catch (error) {
    if (error.name === 'AbortError') {
      setBadge('stopped');
    } else {
      setBadge('error');
      $('conclusion').textContent = error.message;
    }
  } finally {
    controller = null;
    $('ask').disabled = false;
    $('stop').disabled = true;
  }
}

// ---------------------------------------------------------------- 渲染

function finish(result, startedAt, firstDeltaAt, deltaChars) {
  // 用最终结果**覆盖**增量阶段吐出来的文本，而不是接着它写。
  // 两者理论上一样，但最终结果经过 parseAnswer（trim、去重）——
  // 让页面显示的那一份，永远是被校验过的那一份。
  $('conclusion').textContent = result.conclusion;
  setBadge(result.insufficient ? 'insufficient' : 'done');

  for (const field of result.evidence) {
    const tag = document.createElement('code');
    tag.textContent = field;
    $('evidence').appendChild(tag);
  }

  const elapsed = (at) => (at === null ? '—' : `${Math.round(at - startedAt)} ms`);
  $('metrics').innerHTML =
    `首字延迟 <b>${elapsed(firstDeltaAt)}</b>` +
    `　·　总耗时 <b>${Math.round(performance.now() - startedAt)} ms</b>` +
    `　·　增量 <b>${deltaChars}</b> 字　·　最终 <b>${result.conclusion.length}</b> 字`;
}

function setBadge(state, caret = false) {
  const badge = $('badge');
  badge.className = `badge ${state === 'idle' ? '' : state}`.trim();
  badge.textContent = BADGE_TEXT[state];
  $('conclusion').classList.toggle('caret', caret);
}

/**
 * 解析一个 SSE 帧。
 *
 * 按 SSE 规范，一个帧里的多行 `data:` 要用换行拼起来再解析。
 * 我们的服务只发一行，但照规范写是零成本，将来发多行也不会突然坏掉。
 */
function parseFrame(frame) {
  let name = 'message';
  const dataLines = [];

  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
  }

  return { name, data: JSON.parse(dataLines.join('\n')) };
}
</script>
</body>
</html>
